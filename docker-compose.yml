version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gkj-eh-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gkj_eh
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
